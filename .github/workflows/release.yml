name: Release

on:
  push:
    tags:
      - '*-loupgarenne'

jobs:
  build:
    uses: ./.github/workflows/build-common.yml
    with:
      create_archives: true

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Display artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -name "*.tar.gz" -o -name "*.zip" | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/lugaru-loupgarenne-${{ needs.build.outputs.version }}-linux-x64/lugaru-loupgarenne-${{ needs.build.outputs.version }}-linux-x64.tar.gz
            artifacts/lugaru-loupgarenne-${{ needs.build.outputs.version }}-macos-universal/lugaru-loupgarenne-${{ needs.build.outputs.version }}-macos-universal.zip
            artifacts/lugaru-loupgarenne-${{ needs.build.outputs.version }}-windows-x64/lugaru-loupgarenne-${{ needs.build.outputs.version }}-windows-x64.zip
            artifacts/lugaru-loupgarenne-${{ needs.build.outputs.version }}-windows-x86/lugaru-loupgarenne-${{ needs.build.outputs.version }}-windows-x86.zip
          draft: false
          prerelease: false
          generate_release_notes: true
